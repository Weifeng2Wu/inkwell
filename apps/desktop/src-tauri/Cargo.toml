[package]
name = "inkwell"
version = "0.1.4"
description = "AI-native LaTeX editor"
authors = ["Inkwell"]
edition = "2021"

[lib]
name = "inkwell_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["full"] }
notify = "8"
portable-pty = "0.9"
reqwest = { version = "0.13", features = ["json", "stream"] }
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-opener = "2"
encoding_rs = "0.8"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sha2 = "0.10"
base64 = "0.22.1"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
