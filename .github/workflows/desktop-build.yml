name: Desktop build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.5"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24.17.0"
          cache: pnpm
      - name: Verify release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const { version } = JSON.parse(readFileSync("package.json", "utf8")); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Release tag must match package.json version");'
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Packaging unit tests
        run: node --test scripts/test/*.test.mjs
      - name: Agent tests
        run: pnpm agent:test
      - name: Frontend checks
        run: pnpm --filter @inkwell/desktop typecheck
      - name: Frontend tests
        run: pnpm --filter @inkwell/desktop test
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Build and verify frontend export
        run: |
          pnpm --filter @inkwell/desktop build
          node --input-type=module -e "import { access } from 'node:fs/promises'; await access('apps/desktop/out/index.html'); await access('apps/desktop/out/_next'); console.log('Verified apps/desktop/out frontend export.');"
      - name: Configure short Windows runtime staging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $drive = [System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)
          "INKWELL_RUNTIME_RESOURCES=$($drive)iw-agent" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build portable desktop installers
        run: pnpm tauri:build --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Preserve macOS application if DMG packaging fails
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          bundle="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          if [ -d "$bundle/Inkwell.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$bundle/Inkwell.app" "$RUNNER_TEMP/Inkwell-${{ matrix.name }}.app.zip"
          fi
      - name: Upload macOS packaging diagnostics and fallback application
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: Inkwell-${{ matrix.name }}-packaging-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/Inkwell-${{ matrix.name }}.app.zip
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.sh
      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: Inkwell-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download installers from all platforms
        uses: actions/download-artifact@v6
        with:
          pattern: Inkwell-*
          path: installers
          merge-multiple: true
      - name: Create or update the release and upload installers
        shell: bash
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(find installers -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          for extension in exe dmg deb AppImage; do
            if ! find installers -type f -name "*.${extension}" -print -quit | grep -q .; then
              echo "Missing ${extension} installer; release will not be published." >&2
              exit 1
            fi
          done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            flags=(--verify-tag --draft --title "Inkwell $RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
