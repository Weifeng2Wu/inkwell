name: Desktop build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.5"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24.17.0"
          cache: pnpm
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Packaging unit tests
        run: node --test scripts/test/*.test.mjs
      - name: Agent tests
        run: pnpm agent:test
      - name: Frontend checks
        run: pnpm --filter @inkwell/desktop typecheck
      - name: Frontend tests
        run: pnpm --filter @inkwell/desktop test
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Configure short Windows runtime staging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $drive = [System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)
          "INKWELL_RUNTIME_RESOURCES=$($drive)iw-agent" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build portable desktop installers
        run: pnpm tauri:build --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Preserve macOS application if DMG packaging fails
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          bundle="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          if [ -d "$bundle/Inkwell.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$bundle/Inkwell.app" "$RUNNER_TEMP/Inkwell-${{ matrix.name }}.app.zip"
          fi
      - name: Upload macOS packaging diagnostics and fallback application
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: Inkwell-${{ matrix.name }}-packaging-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/Inkwell-${{ matrix.name }}.app.zip
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.sh
      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: Inkwell-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
